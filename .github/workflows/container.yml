name: Build container images

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.*'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: energyplus
            dockerfile: Dockerfile.energyplus
            image: building-simulation-energyplus
            version: 26.2.0
          - name: openmodelica-buildings
            dockerfile: Dockerfile.openmodelica-buildings
            image: building-simulation-openmodelica-buildings
            version: om1.26.3-buildings14.0.0
          - name: omedit-gui
            dockerfile: Dockerfile.omedit-gui
            image: building-simulation-omedit-gui
            version: om1.26.3-buildings14.0.0
          - name: openstudio-gui
            dockerfile: Dockerfile.openstudio-gui
            image: building-simulation-openstudio-gui
            version: 1.12.0-rc2
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
